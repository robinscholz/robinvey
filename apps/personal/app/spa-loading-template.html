<!-- The static 404 page boots the app in the browser; this stands in for the
     error page until it does: the ground and the header, set with the page’s
     own classes, which the stylesheet already carries. -->
<div class="bg-surface-low text-surface fixed inset-0">
  <header
    class="max-w-[64ch] px-6 pt-8 pb-12 md:px-12 md:pt-12 md:pb-24 xl:px-20"
  >
    <h1>Not found</h1>
    <p class="text-surface-muted">404</p>
    <p class="mt-[1lh]">
      <a href="/" class="underline decoration-1 underline-offset-[0.2em]"
        >robinvey.com</a
      >
    </p>
  </header>
</div>

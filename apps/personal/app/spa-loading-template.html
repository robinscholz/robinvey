<!-- The static 404 page boots the app in the browser; this stands in for the
     error page until it does: the dark ground and the header, set with the
     page’s own classes, which the stylesheet already carries. -->
<div
  class="bg-surface-low text-surface fixed inset-0"
  data-color-mode="dark"
>
  <header
    class="grid-page items-baseline gap-y-[1lh] px-5 pt-6 pb-12 md:px-10 md:pt-10 md:pb-24"
  >
    <div>
      <h1 class="font-medium">Not found</h1>
      <p class="text-surface-muted">
        <span class="mr-[1ch]" aria-hidden="true">🥀</span>404
      </p>
    </div>
    <p>
      <a href="/" class="underline decoration-1 underline-offset-[0.2em]"
        >robinvey.com</a
      >
    </p>
  </header>
</div>
